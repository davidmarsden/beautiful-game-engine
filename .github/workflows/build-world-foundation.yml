name: Build Inaugural TBG World

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-inaugural-tbg-world
  cancel-in-progress: false

jobs:
  build-world:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine repository
        uses: actions/checkout@v4
        with:
          path: beautiful-game-engine
          fetch-depth: 0

      - name: Check out canonical data repository
        uses: actions/checkout@v4
        with:
          repository: davidmarsden/beautiful-game-data
          path: beautiful-game-data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine dependencies
        working-directory: beautiful-game-engine
        run: npm install

      - name: Run engine tests
        working-directory: beautiful-game-engine
        run: npm test

      - name: Build foundation and seed inaugural divisions
        working-directory: beautiful-game-engine
        run: npm run build:inaugural-world -- --dataRoot=../beautiful-game-data --outputDir=derived/world

      - name: Verify frozen four-division membership
        working-directory: beautiful-game-engine
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const divisions = JSON.parse(await readFile('derived/world/divisions.json', 'utf8'));
          if (divisions.length !== 4 || divisions.some(d => d.club_ids.length !== 20 || d.seeding_status !== 'frozen_inaugural_membership')) {
            console.error('Inaugural world must contain four frozen divisions of twenty clubs.');
            process.exit(1);
          }
          console.log('Verified four frozen divisions of twenty clubs.');
          NODE

      - name: Upload inaugural world artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbg-inaugural-world
          path: beautiful-game-engine/derived/world/**
          if-no-files-found: error

      - name: Commit generated inaugural world
        working-directory: beautiful-game-engine
        run: |
          if [ -z "$(git status --porcelain derived/world)" ]; then
            echo "No inaugural-world changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived/world
          git commit -m "Build and seed inaugural TBG world"
          git push
