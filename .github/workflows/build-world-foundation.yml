name: Build TBG World Foundation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tbg-world-foundation
  cancel-in-progress: false

jobs:
  build-world:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine repository
        uses: actions/checkout@v4
        with:
          path: beautiful-game-engine
          fetch-depth: 0

      - name: Check out canonical data repository
        uses: actions/checkout@v4
        with:
          repository: davidmarsden/beautiful-game-data
          path: beautiful-game-data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine dependencies
        working-directory: beautiful-game-engine
        run: npm install

      - name: Run engine tests
        working-directory: beautiful-game-engine
        run: npm test

      - name: Build canonical world foundation
        working-directory: beautiful-game-engine
        run: npm run build:world-foundation -- --dataRoot=../beautiful-game-data --outputDir=derived/world

      - name: Upload world foundation artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbg-world-foundation
          path: beautiful-game-engine/derived/world/**
          if-no-files-found: error

      - name: Commit generated world foundation
        working-directory: beautiful-game-engine
        run: |
          if [ -z "$(git status --porcelain derived/world)" ]; then
            echo "No world-foundation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived/world
          git commit -m "Build TBG world foundation"
          git push
