name: Build TBG World State

on:
  workflow_dispatch:
    inputs:
      dataRef:
        description: "beautiful-game-data branch, tag or SHA to read player pools from"
        required: true
        default: "main"
      mode:
        description: "Build unsigned snapshot or assign squads first"
        required: true
        default: "assign-squads"
        type: choice
        options:
          - assign-squads
          - unsigned-snapshot
      assignmentMode:
        description: "Squad assignment mode"
        required: true
        default: "global-importance"
        type: choice
        options:
          - global-importance
          - real-clubs
          - snake-draft
          - banded
      draftOrder:
        description: "Draft order, only used for snake draft"
        required: true
        default: "division-balanced"
        type: choice
        options:
          - division-balanced
          - random
          - reverse-strength
      seasonId:
        description: "Season ID for the generated world state"
        required: true
        default: "season-001"
      worldId:
        description: "World ID for the generated world state"
        required: true
        default: "tbg-alpha-world"
      squadSize:
        description: "Target squad size when assigning squads"
        required: true
        default: "25"
      clubCount:
        description: "Number of real clubs to include when using real-clubs/global-importance mode"
        required: true
        default: "100"
      minSquadSize:
        description: "Minimum real-club squad size required for inclusion"
        required: true
        default: "18"

permissions:
  contents: write

jobs:
  build-world-state:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine repository
        uses: actions/checkout@v4
        with:
          path: beautiful-game-engine

      - name: Check out data repository
        uses: actions/checkout@v4
        with:
          repository: davidmarsden/beautiful-game-data
          ref: ${{ github.event.inputs.dataRef }}
          path: beautiful-game-data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine dependencies
        working-directory: beautiful-game-engine
        run: npm install

      - name: Run engine tests
        working-directory: beautiful-game-engine
        run: npm test

      - name: Build unsigned world state from data player pools
        if: ${{ github.event.inputs.mode == 'unsigned-snapshot' }}
        working-directory: beautiful-game-engine
        run: |
          npm run build:world-state -- \
            --globalPlayers=../beautiful-game-data/derived/tbg-player-pools/global-players.json \
            --gamePlayers=../beautiful-game-data/derived/tbg-player-pools/game-players.json \
            --unsignedPlayers=../beautiful-game-data/derived/tbg-player-pools/unsigned-players.json \
            --submittedPlayers=../beautiful-game-data/derived/tbg-player-pools/submitted-players.json \
            --seasonId=${{ github.event.inputs.seasonId }} \
            --worldId=${{ github.event.inputs.worldId }} \
            --output=derived/world-state/tbg-alpha-world.json \
            --summary=derived/world-state/tbg-alpha-world-summary.json

      - name: Assign squads and build playable world state
        if: ${{ github.event.inputs.mode == 'assign-squads' }}
        working-directory: beautiful-game-engine
        run: |
          npm run assign:squads -- \
            --globalPlayers=../beautiful-game-data/derived/tbg-player-pools/global-players.json \
            --unsignedPlayers=../beautiful-game-data/derived/tbg-player-pools/unsigned-players.json \
            --submittedPlayers=../beautiful-game-data/derived/tbg-player-pools/submitted-players.json \
            --seasonId=${{ github.event.inputs.seasonId }} \
            --worldId=${{ github.event.inputs.worldId }} \
            --squadSize=${{ github.event.inputs.squadSize }} \
            --clubCount=${{ github.event.inputs.clubCount }} \
            --minSquadSize=${{ github.event.inputs.minSquadSize }} \
            --assignmentMode=${{ github.event.inputs.assignmentMode }} \
            --draftOrder=${{ github.event.inputs.draftOrder }} \
            --worldOutput=derived/world-state/tbg-alpha-world.json \
            --worldSummaryOutput=derived/world-state/tbg-alpha-world-summary.json

      - name: Upload world-state artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tbg-world-state
          path: |
            beautiful-game-engine/derived/world-state/tbg-alpha-world.json
            beautiful-game-engine/derived/world-state/tbg-alpha-world-summary.json
            beautiful-game-engine/derived/squad-assignment/assigned-players.json
            beautiful-game-engine/derived/squad-assignment/unsigned-players-after-assignment.json
            beautiful-game-engine/derived/squad-assignment/club-squad-report.json
            beautiful-game-engine/derived/squad-assignment/summary.json
            beautiful-game-engine/derived/squad-assignment/real-clubs.json
            beautiful-game-engine/derived/squad-assignment/draft-picks.json
          if-no-files-found: ignore

      - name: Commit world-state output
        working-directory: beautiful-game-engine
        run: |
          if [ -z "$(git status --porcelain derived/world-state derived/squad-assignment)" ]; then
            echo "No world-state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived/world-state derived/squad-assignment
          git commit -m "Build TBG playable world state"
          git push
