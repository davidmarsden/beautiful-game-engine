name: Run Season Replay

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season starting year"
        required: true
        default: "2024"
      league:
        description: "API-Football league id"
        required: true
        default: "39"
      seed:
        description: "Replay seed"
        required: true
        default: "season-replay"
      maxFixtures:
        description: "Optional fixture limit"
        required: false
        default: ""

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: beautiful-game-engine

      - name: Checkout data
        uses: actions/checkout@v4
        with:
          repository: davidmarsden/beautiful-game-data
          path: beautiful-game-data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Engine unit tests
        working-directory: beautiful-game-engine
        run: npm test

      - name: Run season replay
        working-directory: beautiful-game-engine
        run: |
          PACK="../beautiful-game-data/exports/league-packs/league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}.json"
          OUT="season-report-league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}.json"
          if [ -n "${{ github.event.inputs.maxFixtures }}" ]; then
            node scripts/simulate-season.js --pack="$PACK" --seed="${{ github.event.inputs.seed }}" --maxFixtures="${{ github.event.inputs.maxFixtures }}" --json="$OUT"
          else
            node scripts/simulate-season.js --pack="$PACK" --seed="${{ github.event.inputs.seed }}" --json="$OUT"
          fi

      - name: Upload season report
        uses: actions/upload-artifact@v4
        with:
          name: season-report-league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}
          path: beautiful-game-engine/season-report-league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}.json
