name: Cross-repo data smoke test

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season starting year"
        required: true
        default: "2024"
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: beautiful-game-engine

      - name: Checkout data
        uses: actions/checkout@v4
        with:
          repository: davidmarsden/beautiful-game-data
          path: beautiful-game-data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Engine unit tests
        working-directory: beautiful-game-engine
        run: npm test

      - name: Data unit tests
        working-directory: beautiful-game-data
        run: npm test

      - name: Smoke test exported league pack
        working-directory: beautiful-game-engine
        run: node scripts/smoke-test-league-pack.js ../beautiful-game-data/exports/league-packs/league-39-season-${{ github.event.inputs.season || '2024' }}.json