name: Run SMW Rating Calibration

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season starting year"
        required: true
        default: "2024"
      league:
        description: "API-Football league id"
        required: true
        default: "39"
      targetsPath:
        description: "Path in data repo to SMW/SoccerWiki target ratings CSV or JSON"
        required: true
        default: "calibration/smw-ratings.csv"

jobs:
  smw-rating-calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: beautiful-game-engine

      - name: Checkout data
        uses: actions/checkout@v4
        with:
          repository: davidmarsden/beautiful-game-data
          path: beautiful-game-data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Engine unit tests
        working-directory: beautiful-game-engine
        run: npm test

      - name: Run SMW rating calibration
        working-directory: beautiful-game-engine
        run: |
          PACK="../beautiful-game-data/exports/league-packs/league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}.json"
          TARGETS="../beautiful-game-data/${{ github.event.inputs.targetsPath }}"
          OUT="smw-rating-calibration-league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}.json"
          node scripts/smw-rating-calibration.js --pack="$PACK" --targets="$TARGETS" --json="$OUT"

      - name: Upload SMW rating calibration report
        uses: actions/upload-artifact@v4
        with:
          name: smw-rating-calibration-league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}
          path: beautiful-game-engine/smw-rating-calibration-league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}.json
